algo_config:
  actor:
    _target_: gear_sonic.trl.modules.actor_critic_modules.Actor
    backbone:
      _target_: gear_sonic.trl.modules.universal_token_modules.UniversalTokenModule
      aux_loss_coef:
        g1_recon: 0.01
        g1_smpl_latent: 1.0
        g1_teleop_latent: 1.0
        reencoded_smpl_g1_latent: 1.0
        teleop_smpl_latent: 1.0
      aux_loss_func:
        g1_recon:
          _target_: gear_sonic.trl.losses.token_losses.G1ReconLoss
          loss_type: mse
        g1_smpl_latent:
          _target_: gear_sonic.trl.losses.token_losses.G1SmplLatentLoss
          loss_type: mse
        g1_teleop_latent:
          _target_: gear_sonic.trl.losses.token_losses.G1TeleopLatentLoss
          loss_type: mse
        reencoded_smpl_g1_latent:
          _target_: gear_sonic.trl.losses.token_losses.ReencodedSmplG1LatentLoss
          loss_type: mse
        teleop_smpl_latent:
          _target_: gear_sonic.trl.losses.token_losses.TeleopSmplLatentLoss
          detach_teleop_target: true
          loss_type: mse
      decoders:
        g1_dyn:
          has_temporal_dim: false
          inputs:
          - token_flattened
          - proprioception
          outputs:
          - action
          params:
            _target_: gear_sonic.trl.modules.base_module.BaseModule
            input_dim: null
            module_config_dict:
              layer_config:
                activation: SiLU
                hidden_dims:
                - 2048
                - 2048
                - 1024
                - 1024
                - 512
                - 512
                type: MLP
            num_input_temporal_dims: null
            num_output_temporal_dims: null
            output_dim: null
        g1_kin:
          has_temporal_dim: true
          inputs:
          - token
          outputs:
          - command_multi_future_nonflat
          - motion_anchor_ori_b_mf_nonflat
          params:
            _target_: gear_sonic.trl.modules.base_module.BaseModule
            input_dim: null
            module_config_dict:
              layer_config:
                activation: SiLU
                hidden_dims:
                - 2048
                - 1024
                - 512
                - 512
                type: MLP
            num_input_temporal_dims: 2
            num_output_temporal_dims: 10
            output_dim: null
      encoder_sample_probs:
        g1: 1.0
        smpl: 1.0
        teleop: 1.0
      encoders:
        g1:
          inputs:
          - command_multi_future_nonflat
          - motion_anchor_ori_b_mf_nonflat
          params:
            _target_: gear_sonic.trl.modules.base_module.BaseModule
            input_dim: null
            module_config_dict:
              layer_config:
                activation: SiLU
                hidden_dims:
                - 2048
                - 1024
                - 512
                - 512
                type: MLP
            num_input_temporal_dims: 10
            num_output_temporal_dims: 2
            output_dim: null
        smpl:
          inputs:
          - smpl_joints_multi_future_local_nonflat
          - smpl_root_ori_b_multi_future
          - joint_pos_multi_future_wrist_for_smpl
          params:
            _target_: gear_sonic.trl.modules.base_module.BaseModule
            input_dim: null
            module_config_dict:
              layer_config:
                activation: SiLU
                hidden_dims:
                - 2048
                - 1024
                - 512
                - 512
                type: MLP
            num_input_temporal_dims: 10
            num_output_temporal_dims: 2
            output_dim: null
        teleop:
          inputs:
          - command_multi_future_lower_body
          - vr_3point_local_target
          - vr_3point_local_orn_target
          - motion_anchor_ori_b
          params:
            _target_: gear_sonic.trl.modules.base_module.BaseModule
            input_dim: null
            module_config_dict:
              layer_config:
                activation: SiLU
                hidden_dims:
                - 2048
                - 1024
                - 512
                - 512
                type: MLP
            num_input_temporal_dims: null
            num_output_temporal_dims: 2
            output_dim: null
      fsq_level_list: 32
      max_num_tokens: 2
      num_fsq_levels: 32
      num_future_frames: 10
      proprioception_features:
      - actor_obs
      quantizer:
        _target_: vector_quantize_pytorch.FSQ
      reencode_smpl_g1_recon: true
    has_aux_loss: true
    input_obs_dict: true
    running_mean_std: false
  actor_learning_rate: 2.0e-05
  adaptive_lr_max: 0.0002
  adaptive_lr_min: 3.0e-05
  clip_param: 0.1
  critic:
    _target_: gear_sonic.trl.modules.actor_critic_modules.Critic
    backbone:
      _target_: gear_sonic.trl.modules.base_module.BaseModule
      module_config_dict:
        input_dim:
        - critic_obs
        layer_config:
          activation: SiLU
          hidden_dims:
          - 2048
          - 2048
          - 1024
          - 1024
          - 512
          - 512
          type: MLP
        output_dim:
        - 1
        type: MLP
      process_output_dim: true
    running_mean_std: true
  critic_learning_rate: 0.001
  desired_kl: 0.025
  empty_cache_every_n_ppo_epoch: -1
  entropy_coef: 0.03
  eval:
    num_eval_episodes: 150
    num_save_episodes: 200
    save_goal_reached_only: true
    save_trajectories: false
    save_videos: false
    video_save_prob: 1.0
  eval_frequency: 600
  gamma: 0.99
  global_rank: 0
  init_at_random_ep_len: true
  init_noise_std: 0.05
  lam: 0.95
  load_optimizer: true
  max_grad_norm: 0.1
  num_learning_epochs: 3
  num_learning_iterations: 100000
  num_mini_batches: 4
  num_steps_per_env: 24
  ppo_shuffle_every_epoch: true
  save_interval: 200
  schedule: adaptive
  std_clamp_max: 0.3333333333333333
  std_clamp_min: 0.001
  sync_advantage_normalization: true
  use_clampped_std: true
  use_clipped_value_loss: true
  use_new_actor_critic: true
  use_padding_mask: false
  value_loss_coef: 1.0
  world_size: 2
