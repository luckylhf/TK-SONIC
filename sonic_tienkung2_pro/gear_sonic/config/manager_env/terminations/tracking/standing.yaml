# Standing model termination composition
# Only check horizontal position (XY), allow vertical drift
# Relaxed thresholds for learning balance

defaults:
  - terms/anchor_pos_xy@_here_
  - terms/ee_body_pos@_here_
  - terms/motion_time_out@_here_
  - terms/foot_pos_xyz@_here_

_target_: gear_sonic.envs.manager_env.mdp.terminations.TerminationsCfg

anchor_pos_xy:
  params:
    threshold: 1.0  # Increased from 0.5 to allow more horizontal drift

ee_body_pos:
  params:
    threshold: 2.0  # Increased from 1.5

foot_pos_xyz:
  params:
    threshold: 2.0  # Increased from 1.5
